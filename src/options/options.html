<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>WebRTC Analyzer 設定</title>
<link rel="stylesheet" href="options.css">
</head>
<body>

<h1>WebRTC Analyzer <span class="sub">設定</span></h1>
<p class="lead">変更は自動保存され、開いているタブに即座に反映されます。</p>

<section>
  <h2>一般</h2>

  <label class="row">
    <span class="label">更新間隔</span>
    <span class="ctl">
      <input type="number" id="intervalMs" min="200" max="10000" step="100"> <span class="unit">ms</span>
    </span>
    <span class="hint">getStats() を呼ぶ間隔。短くすると細かい変動が見えるがページの負荷が増える（下限 200ms）</span>
  </label>

  <label class="row">
    <span class="label">スパークライン</span>
    <span class="ctl"><input type="checkbox" id="sparkline"> 直近の推移を折れ線で表示する</span>
    <span class="hint">OFF にすると数値だけの2列表示になり、小窓が小さくなる</span>
  </label>

  <label class="row">
    <span class="label">折れ線の範囲</span>
    <span class="ctl">
      <input type="number" id="sparkSeconds" min="10" max="600" step="10"> <span class="unit">秒</span>
    </span>
    <span class="hint">折れ線が遡る時間</span>
  </label>

  <label class="row">
    <span class="label">履歴の保持</span>
    <span class="ctl">
      <input type="number" id="historyMinutes" min="1" max="240" step="1"> <span class="unit">分</span>
    </span>
    <span class="hint">CSV / JSON エクスポート用にメモリ上に保持する長さ。ページを離れると消える</span>
  </label>

  <label class="row">
    <span class="label">しきい値アラート</span>
    <span class="ctl"><input type="checkbox" id="alerts"> しきい値を超えた値に色を付ける</span>
    <span class="hint">超過した項目の数を小窓のヘッダーにも出す</span>
  </label>
</section>

<section>
  <h2>表示項目</h2>
  <p class="lead">小窓に出す項目。チェックを外すと表示されなくなる（履歴とエクスポートには常に全項目が入る）。</p>
  <div id="fields" class="fields"></div>
</section>

<section>
  <h2>しきい値</h2>
  <p class="lead">値がこれ以上になると色が変わる。空欄にするとその段階の判定を行わない。</p>
  <table id="thresholds">
    <thead>
      <tr><th>項目</th><th>警告 (warn)</th><th>重大 (crit)</th><th class="desc">補足</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</section>

<section>
  <h2>ログ</h2>
  <p class="lead">
    計測中のタブから自動で集めたログ。配信が止まったあとやタブを閉じたあとでも、ここから保存できる。
    保存先はメモリ上のセッション領域なので、<b>ブラウザを閉じると消える</b>（ディスクには残らない）。
  </p>
  <div id="logs" class="logs"></div>
  <div class="logs-foot">
    <button id="logs-clear" class="danger">ログをすべて削除</button>
    <span id="logs-status" class="status"></span>
  </div>
</section>

<div class="footer">
  <button id="reset" class="danger">すべて既定値に戻す</button>
  <span id="status" class="status"></span>
</div>

<script src="../common/config.js"></script>
<script src="../common/export.js"></script>
<script src="options.js"></script>
</body>
</html>
