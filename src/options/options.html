<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>WebRTC Analyzer 設定</title>
<link rel="stylesheet" href="options.css">
</head>
<body>

<h1>WebRTC Analyzer <span class="sub">設定</span></h1>
<p class="lead">変更は自動保存され、開いているタブに即座に反映されます。</p>

<section>
  <h2>起動</h2>

  <div class="row">
    <span class="label">小窓の表示</span>
    <span class="ctl">
      <button id="toggleEnabled"></button> <span id="enabledState" class="unit"></span>
    </span>
    <span class="hint">全タブ共通。ツールバーのアイコンをクリックしても切り替えられる</span>
  </div>

  <label class="row">
    <span class="label">自動起動</span>
    <span class="ctl"><input type="checkbox" id="autoStart"> ブラウザ起動時に自動で表示をONにする</span>
    <span class="hint">OFF の場合、ブラウザを起動するたびに表示OFFから始まる</span>
  </label>
</section>

<section>
  <h2>一般</h2>

  <label class="row">
    <span class="label">更新間隔</span>
    <span class="ctl">
      <input type="number" id="intervalMs" min="200" max="10000" step="100"> <span class="unit">ms</span>
    </span>
    <span class="hint">getStats() を呼ぶ間隔。短くすると細かい変動が見えるがページの負荷が増える（下限 200ms）</span>
  </label>

  <label class="row">
    <span class="label">スパークライン</span>
    <span class="ctl"><input type="checkbox" id="sparkline"> 直近の推移を折れ線で表示する</span>
    <span class="hint">OFF にすると数値だけの2列表示になり、小窓が小さくなる</span>
  </label>

  <label class="row">
    <span class="label">折れ線の範囲</span>
    <span class="ctl">
      <input type="number" id="sparkSeconds" min="10" max="600" step="10"> <span class="unit">秒</span>
    </span>
    <span class="hint">折れ線が遡る時間</span>
  </label>

  <label class="row">
    <span class="label">履歴の保持</span>
    <span class="ctl">
      <input type="number" id="historyMinutes" min="1" max="240" step="1"> <span class="unit">分</span>
    </span>
    <span class="hint">小窓のエクスポートとスパークライン用にメモリ上に保持する長さ</span>
  </label>

  <label class="row">
    <span class="label">履歴の保存</span>
    <span class="ctl"><input type="checkbox" id="persist"> ページを離れても履歴を残す</span>
    <span class="hint">10秒ごとに拡張のストレージへ書き出す。下の「保存済みの履歴」から書き出せる</span>
  </label>

  <label class="row">
    <span class="label">保存期間</span>
    <span class="ctl">
      <input type="number" id="persistHours" min="1" max="720" step="1"> <span class="unit">時間</span>
    </span>
    <span class="hint">最後の記録からこれだけ経ったセッションは自動で消す（1時間あたり約2MB / 2ストリーム）</span>
  </label>

  <label class="row">
    <span class="label">しきい値アラート</span>
    <span class="ctl"><input type="checkbox" id="alerts"> しきい値を超えた値に色を付ける</span>
    <span class="hint">超過した項目の数を小窓のヘッダーにも出す</span>
  </label>
</section>

<section>
  <h2>表示項目</h2>
  <p class="lead">小窓に出す項目。チェックを外すと表示されなくなる（履歴とエクスポートには常に全項目が入る）。</p>
  <div id="fields" class="fields"></div>
</section>

<section>
  <h2>しきい値</h2>
  <p class="lead">値がこれ以上になると色が変わる。空欄にするとその段階の判定を行わない。</p>
  <table id="thresholds">
    <thead>
      <tr><th>項目</th><th>警告 (warn)</th><th>重大 (crit)</th><th class="desc">補足</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</section>

<section>
  <h2>保存済みの履歴</h2>
  <p class="lead">ページ単位（リロードごとに別セッション）。IPアドレスやURLのパスは保存しない。</p>
  <table id="sessions">
    <thead>
      <tr><th>開始</th><th>最終記録</th><th>ホスト</th><th>行数</th><th></th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <p class="actions">
    <button id="refreshSessions">再読み込み</button>
    <button id="clearSessions" class="danger">すべて削除</button>
  </p>
</section>

<div class="footer">
  <button id="reset" class="danger">すべて既定値に戻す</button>
  <span id="status" class="status"></span>
</div>

<script src="../common/config.js"></script>
<script src="../common/export.js"></script>
<script src="options.js"></script>
</body>
</html>
